
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Truck</title>
    <link rel="stylesheet" href="./style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./script.js" defer></script>
</head>
<body>

    <div class="background"></div>
    <div class="dark-overlay"></div>

    <header class="header">
        <div class="logo">
            <div class="logo-icon">LT</div>
            <div>
                <h2>LUXURY TRUCK</h2>
                <span>PREMIUM TRUCK MANAGEMENT</span>
            </div>
        </div>
        <div class="header-label">سیستم مدیریت ناوگان</div>
    </header>

    <main class="main">

        <section id="authSection" class="login-card">
            <div class="emblem">LT</div>

            <h1 id="formTitle">خوش آمدید</h1>
            <p class="description">به دنیای لوکس مدیریت کامیون‌ها خوش آمدید</p>

            <form id="authForm">

                <div class="field">
                    <label for="email">ایمیل کاربری</label>
                    <input type="email" id="email"
                        placeholder="ایمیل خود را وارد کنید" required>
                </div>

                <div class="field">
                    <label for="password">رمز عبور</label>
                    <input type="password" id="password"
                        placeholder="رمز عبور خود را وارد کنید"
                        minlength="6" required>
                </div>

                <button type="submit" id="submitButton">
                    ورود به حساب
                </button>

                <p id="message"></p>
            </form>

            <div class="separator"><span>یا</span></div>

            <button type="button" id="switchMode" class="switch-button">
                حساب ندارید؟ ثبت‌نام کنید
            </button>
        </section>

        <section id="dashboard" class="dashboard hidden">
            <h1>به Luxury Truck خوش آمدید</h1>
            <p id="userEmail"></p>

            <div class="dashboard-grid">
                <div class="dashboard-item">🚛 مدیریت کامیون‌ها</div>
                <div class="dashboard-item">🔧 تعمیر و نگهداری</div>
                <div class="dashboard-item">💰 حسابداری</div>
                <div class="dashboard-item">📅 برنامه روزانه</div>
                <div class="dashboard-item">🔔 اعلان‌ها</div>
            </div>

            <button id="logoutButton" class="logout-button">
                خروج از حساب
            </button>
        </section>

    </main>

    <footer class="footer">
        <span>© 2026 LUXURY TRUCK</span>
        <span>POWER • LUXURY • MANAGEMENT</span>
    </footer>

</body>
</html>
